services:
  postgres:
    image: postgres:16-alpine
    container_name: gennio-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gennio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: gennio-rabbit
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-admin}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: gennio-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  ai-generation:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - rabbitmq
    command: ["npm", "run", "start:ai"]

  frontend:
    build:
      context: ../gennio-frontend
      dockerfile: Dockerfile
    container_name: gennio-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
    - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

  loki:
    image: grafana/loki:2.9.2
    container_name: gennio-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/tmp/loki

  promtail:
    image: grafana/promtail:2.9.2
    container_name: gennio-promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki

  alerts:
      build: ./alerts
      container_name: gennio-alerts
      restart: unless-stopped
      env_file:
        - .env
      environment:
        - LOKI_URL=http://loki:3100
        - POLL_SEC=30
        - TG_TOKEN=${TG_TOKEN}
        - TG_CHAT_ID=${TG_CHAT_ID}
      depends_on:
        - loki

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  loki_data:
